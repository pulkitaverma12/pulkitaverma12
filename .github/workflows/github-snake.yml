name: Generate Snake Animation

on:
  # Run daily at 6:00 AM UTC
  schedule:
    - cron: "0 6 * * *"
  # Allow manual trigger from Actions tab
  workflow_dispatch:
  # Also run on push to main/master
  push:
    branches:
      - main
      - master

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake (dark theme)
        uses: Platane/snk@v3
        with:
          github_user_name: pulkitaverma12
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Override colors for custom pink/purple snake
      - name: Generate custom colored snake
        uses: Platane/snk@v3
        with:
          github_user_name: pulkitaverma12
          outputs: |
            dist/github-snake-custom.svg?color_snake=ff79c6&color_dots=#ff79c6,#c678dd,#7c3aed,#4c1d95,#2d1b69
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake outputs to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
