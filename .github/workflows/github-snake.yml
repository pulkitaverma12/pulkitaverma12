name: Generate Snake Animation

on:
  # Run daily at 6:00 AM UTC
  schedule:
    - cron: "0 6 * * *"
  # Allow manual trigger from Actions tab
  workflow_dispatch:
  # Also run on push to main
  push:
    branches:
      - main

# ✅ Grant write access so the action can push to the "output" branch
permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Generate contribution snake (light + dark theme)
        uses: Platane/snk@v3
        with:
          github_user_name: pulkitaverma12
          outputs: |
            dist/github-snake.svg?palette=github
            dist/github-snake-dark.svg?palette=github-dark
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate custom pink/purple snake
        uses: Platane/snk@v3
        with:
          github_user_name: pulkitaverma12
          outputs: |
            dist/github-snake-pink.svg?color_snake=#ff79c6&color_dots=#2d1b69,#4c1d95,#7c3aed,#c678dd,#ff79c6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Push snake outputs to "output" branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
