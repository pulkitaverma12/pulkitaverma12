<svg xmlns="http://www.w3.org/2000/svg" width="495" height="225" viewBox="0 0 495 225">
<defs>
  <linearGradient id="cardBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#1a0a2e"/>
    <stop offset="100%" style="stop-color:#0d0020"/>
  </linearGradient>
  <linearGradient id="rankRingGrad" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#ff79c6"/>
    <stop offset="100%" style="stop-color:#7c3aed"/>
  </linearGradient>
  <linearGradient id="statBar" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:#e040fb"/>
    <stop offset="100%" style="stop-color:#7c3aed"/>
  </linearGradient>
  <filter id="cardShadow" x="-5%" y="-5%" width="110%" height="120%">
    <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#9b59b6" flood-opacity="0.4"/>
  </filter>
  <filter id="textGlow">
    <feGaussianBlur stdDeviation="2" result="blur"/><feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
</defs>

<rect width="495" height="225" rx="10" fill="url(#cardBg)" filter="url(#cardShadow)"/>
<rect width="495" height="225" rx="10" fill="none" stroke="#3a1a5e" stroke-width="1.5"/>

<text x="25" y="35" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="bold" fill="#ff79c6" filter="url(#textGlow)">Pulkita's GitHub Stats</text>

<!-- Rank ring (animated) -->
<g transform="translate(395,115)">
  <circle r="52" fill="none" stroke="#2a0a3e" stroke-width="8"/>
  <circle r="52" fill="none" stroke="url(#rankRingGrad)" stroke-width="8"
          stroke-linecap="round" stroke-dasharray="0 327" transform="rotate(-90)">
    <animate attributeName="stroke-dasharray" values="0 327;229 327" dur="2s" fill="freeze" begin="0.5s" calcMode="spline" keySplines="0.4 0 0.2 1"/>
  </circle>
  <text x="0" y="-8" font-family="'Segoe UI',Arial,sans-serif" font-size="11" fill="#c678dd" text-anchor="middle">RANK</text>
  <text x="0" y="10" font-family="'Segoe UI',Arial,sans-serif" font-size="22" font-weight="bold" fill="#ff79c6" text-anchor="middle" filter="url(#textGlow)">B+</text>
  <text x="0" y="26" font-family="'Segoe UI',Arial,sans-serif" font-size="9" fill="#888" text-anchor="middle">Top 15%</text>
</g>

<!-- Stat rows -->
<g transform="translate(0,60)" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.5s"/>
  <animateTransform attributeName="transform" type="translate" values="-20,60;0,60" dur="0.4s" fill="freeze" begin="0.5s"/>
  <text x="25" y="20" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#f8f8f2">⭐ Total Stars Earned:</text>
  <text x="210" y="20" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="bold" fill="#ff79c6">20</text>
</g>
<g transform="translate(0,82)" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.7s"/>
  <animateTransform attributeName="transform" type="translate" values="-20,82;0,82" dur="0.4s" fill="freeze" begin="0.7s"/>
  <text x="25" y="20" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#f8f8f2">🍴 Total Forks:</text>
  <text x="210" y="20" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="bold" fill="#ff79c6">12</text>
</g>
<g transform="translate(0,104)" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="0.9s"/>
  <animateTransform attributeName="transform" type="translate" values="-20,104;0,104" dur="0.4s" fill="freeze" begin="0.9s"/>
  <text x="25" y="20" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#f8f8f2">🔄 Total Commits (2024):</text>
  <text x="210" y="20" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="bold" fill="#ff79c6">880</text>
</g>
<g transform="translate(0,126)" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.1s"/>
  <animateTransform attributeName="transform" type="translate" values="-20,126;0,126" dur="0.4s" fill="freeze" begin="1.1s"/>
  <text x="25" y="20" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#f8f8f2">🔀 Total PRs:</text>
  <text x="210" y="20" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="bold" fill="#ff79c6">30</text>
</g>
<g transform="translate(0,148)" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.3s"/>
  <animateTransform attributeName="transform" type="translate" values="-20,148;0,148" dur="0.4s" fill="freeze" begin="1.3s"/>
  <text x="25" y="20" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#f8f8f2">🐛 Issues Opened:</text>
  <text x="210" y="20" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="bold" fill="#ff79c6">15</text>
</g>
<g transform="translate(0,170)" opacity="0">
  <animate attributeName="opacity" values="0;1" dur="0.4s" fill="freeze" begin="1.5s"/>
  <animateTransform attributeName="transform" type="translate" values="-20,170;0,170" dur="0.4s" fill="freeze" begin="1.5s"/>
  <text x="25" y="20" font-family="'Segoe UI',Arial,sans-serif" font-size="13" fill="#f8f8f2">📦 Contributed to (last year):</text>
  <text x="245" y="20" font-family="'Segoe UI',Arial,sans-serif" font-size="14" font-weight="bold" fill="#ff79c6">8</text>
</g>

<rect x="0" y="218" width="0" height="7" rx="0" fill="url(#statBar)">
  <animate attributeName="width" values="0;495" dur="1.5s" fill="freeze" begin="1s"/>
</rect>
</svg>