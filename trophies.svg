    <rect x="90" y="4" width="32" height="20" rx="10" fill="#ffd700" opacity="0.9"/>
    <text x="106" y="18" font-family="'Segoe UI',Arial,sans-serif" font-size="10" font-weight="bold" fill="#000" text-anchor="middle">S</text>
    <!-- Icon -->
    <text x="65" y="52" font-family="'Segoe UI',Arial,sans-serif" font-size="28" text-anchor="middle">🏆</text>
    <!-- Title -->
    <text x="65" y="76" font-family="'Segoe UI',Arial,sans-serif" font-size="10" fill="#ffd700" text-anchor="middle">MultiLanguage</text>
    <!-- Shine sweep -->
    <rect x="0" y="0" width="130" height="110" rx="10" fill="none">
      <animate attributeName="opacity" values="0;0.3;0" dur="3s" repeatCount="indefinite" begin="0.20s"/>
    </rect>
    <!-- Glow effect on rank -->
    <rect x="0" y="0" width="130" height="110" rx="10" fill="#ffd700" opacity="0">
      <animate attributeName="opacity" values="0;0.05;0" dur="2s" repeatCount="indefinite" begin="1.20s"/>
    </rect>
  </g>
