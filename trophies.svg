<svg xmlns="http://www.w3.org/2000/svg" width="620" height="320" viewBox="0 0 620 320">
<defs>
  <linearGradient id="trophyBg" x1="0%" y1="0%" x2="100%" y2="100%">
    <stop offset="0%" style="stop-color:#1a0a2e"/>
    <stop offset="100%" style="stop-color:#0d0020"/>
  </linearGradient>
  <filter id="trophyShadow" x="-3%" y="-3%" width="106%" height="115%">
    <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#9b59b6" flood-opacity="0.5"/>
  </filter>
  <linearGradient id="shineSweep" x1="0%" y1="0%" x2="100%" y2="0%">
    <stop offset="0%" style="stop-color:transparent"/>
    <stop offset="50%" style="stop-color:rgba(255,255,255,0.1)"/>
    <stop offset="100%" style="stop-color:transparent"/>
  </linearGradient>
</defs>

<rect width="620" height="320" rx="12" fill="url(#trophyBg)" filter="url(#trophyShadow)"/>
<rect width="620" height="320" rx="12" fill="none" stroke="#3a1a5e" stroke-width="1.5"/>

<!-- Title -->
<text x="20" y="35" font-family="'Segoe UI',Arial,sans-serif" font-size="17" font-weight="bold" fill="#ffd700">🏆 GitHub Trophies</text>

<!-- Shine sweep across whole card -->
<rect x="-620" y="0" width="620" height="320" rx="12" fill="url(#shineSweep)">
  <animate attributeName="x" values="-620;620" dur="4s" repeatCount="indefinite" begin="2s"/>
</rect>


  <g transform="translate(20,55)" opacity="0">
    <animate attributeName="opacity" values="0;1" dur="0.3s" fill="freeze" begin="0.20s"/>
